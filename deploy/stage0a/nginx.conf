# Static server for the Stage 0A-1 client.
#
# Two things matter here beyond "serve the files":
#
#  1. Cache correctness. The prototype changes between play sessions, and a
#     child stuck on last week's JavaScript is a bug report that costs an
#     evening. Vite fingerprints everything under /assets/, so those are
#     immutable forever; index.html names them and must always be revalidated.
#  2. `add_header` does not inherit. A location block that sets any header
#     discards every add_header from the server block, so the security headers
#     are repeated in each location rather than written once.
#
# There is deliberately no Content-Security-Policy. Babylon compiles shader and
# effect code at runtime and eruda uses direct eval (the production build warns
# about exactly that), so a policy strict enough to be worth having would break
# the renderer or the only console this project has on iOS. Revisit with a
# tested policy when the app stops needing eval.

server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # The main bundle is ~1.2 MB raw and ~300 kB gzipped, and some of these
    # children are on mobile data.
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types        text/plain text/css application/javascript application/json
                      image/svg+xml application/wasm application/manifest+json;

    # Cloudflare terminates TLS and is the only thing that should reach here,
    # so the real client address arrives in a header rather than in $remote_addr.
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Container-local health probe. Not routed publicly.
    location = /healthz {
        access_log off;
        add_header Content-Type "text/plain" always;
        return 200 "ok\n";
    }

    # Fingerprinted by Vite: the filename changes whenever the content does, so
    # a year is safe. A missing asset must 404 rather than fall back to the HTML
    # shell, or a broken deploy looks like a working one.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    }

    # Never cached hard: this is the file that names the current bundle.
    location = /index.html {
        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "same-origin" always;
        add_header Permissions-Policy     "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
    }
}
