<!doctype html>
<html lang="et">
  <head>
    <meta charset="UTF-8" />
    <!--
      No `maximum-scale`, and no `user-scalable=no`, on purpose.

      Those two did nothing useful and one real harm. Safari has ignored them
      since iOS 10, so they never prevented the accidental zoom they were there
      for — `touch-action` across the #app subtree does that. But a **home-screen
      install** does honour them, and there is no `aA` menu in a standalone web
      app: a phone that came up zoomed had every escape disabled and could not be
      recovered without deleting the app. Which is exactly what happened.

      Accidental zoom is prevented where it actually occurs. Deliberate zoom is
      left alone, because it is how a person gets back.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!--
      Home-screen identity. iOS Safari cannot hide its own URL bar for a normal
      page, so "Add to Home Screen" is the only route to a full screen — and
      that route needs a name short enough to fit under an icon and an icon that
      is not a screenshot of a dark canvas.
    -->
    <meta name="apple-mobile-web-app-title" content="Seiklus" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/apple-touch-icon.png" />
    <!-- Placeholder only: the real title is set from the i18n catalogue at boot. -->
    <title>Adventure</title>
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <!--
        The joystick lives outside the Preact root: it is redrawn every frame by
        the input layer writing a transform, and reconciling the HUD at 60 fps
        on a phone would waste the frame budget.
      -->
      <div id="joystick-layer"></div>
      <div id="ui-root"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
